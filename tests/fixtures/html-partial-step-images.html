<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tomato Soup</title>
  </head>
  <body>
    <article>
      <h1>Tomato Soup</h1>
      <img class="hero" src="https://cdn.example.test/hero.jpg" width="1200" height="800" alt="Tomato Soup">
      <p>A simple soup.</p>
      <h2>Ingredients</h2>
      <ul>
        <li>2 tomatoes</li>
        <li>1 onion</li>
      </ul>
      <h2>Instructions</h2>
      <ol class="step-list">
        <li><p>Chop the tomatoes and the onion into small pieces.</p></li>
        <li><p>Simmer everything together until soft and blend it.</p></li>
        <li>
          <p>Serve hot with fresh bread and a spoon of cream.</p>
          <img src="https://cdn.example.test/serve.jpg" width="800" height="600" alt="Served soup">
        </li>
      </ol>
    </article>
  </body>
</html>
