<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roasted Baby Potatoes</title>
  </head>
  <body>
    <article class="recipe">
      <h1>Roasted Baby Potatoes</h1>
      <p>Crispy and simple.</p>

      <div class="steps">
        <ol>
          <li>Gather all the ingredients before you start cooking.</li>
          <li>Wash the potatoes thoroughly under running water.</li>
          <li>Bake at 200C for 30 minutes until golden and crisp.</li>
        </ol>
      </div>

      <ul class="ingredients">
        <li>Potatoes - 1 kg</li>
        <li>Olive oil - 2 tbsp</li>
        <li>Salt - 1 tsp</li>
      </ul>
    </article>
  </body>
</html>
