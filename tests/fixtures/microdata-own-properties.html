<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tomato Soup</title>
  </head>
  <body>
    <div itemscope itemtype="https://schema.org/Recipe">
      <div itemprop="author" itemscope itemtype="https://schema.org/Person">
        <span itemprop="name">Jane Cook</span>
        <span itemprop="description">Home cook</span>
      </div>
      <h1 itemprop="name">Tomato Soup</h1>
      <p itemprop="description">A simple soup.</p>
      <ul>
        <li itemprop="recipeIngredient">2 tomatoes</li>
        <li itemprop="recipeIngredient">1 onion</li>
      </ul>
      <div itemprop="recipeInstructions">
        <ol>
          <li>Chop the tomatoes and onion.</li>
          <li>Simmer until soft.</li>
        </ol>
      </div>
    </div>
  </body>
</html>
