<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Layered Salad</title></head>
<body>
  <main itemscope itemtype="https://schema.org/Recipe">
    <h1 itemprop="name">Layered Salad</h1>
    <p itemprop="description">A crisp layered salad with a bright dressing.</p>
    <section class="ingredients">
      <section class="group dressing">
        <h3>Dressing</h3>
        <table><tr><td itemprop="recipeIngredient">2 tbsp olive oil</td></tr></table>
        <ul><li itemprop="recipeIngredient">1 tbsp lemon juice</li></ul>
      </section>
      <section class="group salad">
        <h3>Salad</h3>
        <p itemprop="recipeIngredient">2 tomatoes</p>
        <ul><li><span itemprop="recipeIngredient">1 cucumber</span></li></ul>
      </section>
    </section>
    <section class="instructions">
      <h2>Instructions</h2>
      <ol itemprop="recipeInstructions">
        <li>Whisk the dressing.</li>
        <li>Combine the salad ingredients.</li>
      </ol>
    </section>
  </main>
</body>
</html>
