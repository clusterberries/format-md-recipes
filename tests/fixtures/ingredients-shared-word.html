<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Simple Salad</title>
  </head>
  <body>
    <article class="recipe">
      <h1>Simple Salad</h1>
      <h2>Ingredients</h2>
      <ul>
        <li>Tomatoes - 2 pcs</li>
        <li>Olive oil - 1 tbsp</li>
      </ul>
      <h2>Instructions</h2>
      <ol>
        <li>Chop the tomatoes and toss with olive oil.</li>
        <li>Season with salt and serve.</li>
      </ol>
    </article>
  </body>
</html>
